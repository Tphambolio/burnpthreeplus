version: '3.8'

services:
  # PostgreSQL with PostGIS
  db:
    image: postgis/postgis:15-3.4
    container_name: burnp3_db
    environment:
      POSTGRES_USER: burnp3
      POSTGRES_PASSWORD: burnp3_dev_password
      POSTGRES_DB: burnp3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U burnp3"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - burnp3_network

  # Redis for caching and task queue
  redis:
    image: redis:7-alpine
    container_name: burnp3_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - burnp3_network

  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: burnp3_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - burnp3_network

  # Create MinIO buckets
  minio-init:
    image: minio/mc:latest
    container_name: burnp3_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/burnp3-data || true;
      /usr/bin/mc mb myminio/burnp3-results || true;
      /usr/bin/mc anonymous set download myminio/burnp3-results || true;
      exit 0;
      "
    networks:
      - burnp3_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: burnp3_backend
    environment:
      DATABASE_URL: postgresql://burnp3:burnp3_dev_password@db:5432/burnp3
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_DATA: burnp3-data
      S3_BUCKET_RESULTS: burnp3-results
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv  # Anonymous volume for venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - burnp3_network

  # Celery Worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: burnp3_worker
    environment:
      DATABASE_URL: postgresql://burnp3:burnp3_dev_password@db:5432/burnp3
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET_DATA: burnp3-data
      S3_BUCKET_RESULTS: burnp3-results
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      - db
      - redis
      - backend
    command: celery -A app.worker worker --loglevel=info
    networks:
      - burnp3_network

  # Celery Flower (monitoring)
  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: burnp3_flower
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - worker
    command: celery -A app.worker flower --port=5555
    networks:
      - burnp3_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: burnp3_frontend
    environment:
      VITE_API_URL: http://localhost:8000
      VITE_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: npm run dev
    networks:
      - burnp3_network

  # Nginx reverse proxy (optional for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: burnp3_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - burnp3_network
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  burnp3_network:
    driver: bridge
